# Mosquitto для демонстрационного стенда.
# Анонимный доступ запрещён, права на топики заданы в acl.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# Для стенда с внешними подключениями включите TLS (сертификаты монтируются отдельно):
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# require_certificate false

# Ограничения, защищающие брокер от перегрузки
max_queued_messages 5000
max_inflight_messages 100
message_size_limit 65536
